# Include inside the mega-metro.online server block (see docs/ACCOUNT-DEPLOY.md).
# Needs, once, at http level:  limit_req_zone $binary_remote_addr zone=sf_account:1m rate=30r/m;

# Public account API under both site prefixes. Blank the internal-only header.
location ^~ /api/account/ {
    limit_req zone=sf_account burst=10 nodelay;
    proxy_pass http://127.0.0.1:8766/;
    proxy_set_header X-Quota-Check "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}
location ^~ /scorefollow/api/account/ {
    limit_req zone=sf_account burst=10 nodelay;
    proxy_pass http://127.0.0.1:8766/;
    proxy_set_header X-Quota-Check "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}

# auth_request target for analysis submissions (never reachable from outside).
location = /_sf_quota {
    internal;
    proxy_pass http://127.0.0.1:8766/internal/quota;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Quota-Check "1";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
}

# Put these two lines in BOTH existing analysis locations (/analysis/ and /scorefollow/analysis/):
#     auth_request /_sf_quota;
#     error_page 403 = @sf_quota_exceeded;
# If the account service is down nginx answers 500 for submissions; set the analysis
# location's `error_page 500 502 503 = @sf_quota_open` or run the service with
# ACCOUNT_QUOTA_MODE=off before stopping it.

location @sf_quota_exceeded {
    default_type "application/json; charset=utf-8";
    return 429 '{"error":"今日次数已用完，请登录或明天再试 / Daily limit reached: sign in for more, or try tomorrow","code":"quota"}';
}
